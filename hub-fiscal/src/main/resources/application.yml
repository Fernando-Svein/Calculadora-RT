server:
  port: 8090
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      # sessão expira após 8 horas sem uso
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        name: HUBSESSION

spring:
  application:
    name: hub-fiscal
  web:
    resources:
      cache:
        # o navegador revalida telas/scripts a cada acesso (evita versão antiga após atualizar o hub)
        cachecontrol:
          no-cache: true
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 600MB

# Configuração do hub: URLs das calculadoras e caminhos de arquivos ficam só aqui (ver HubProperties).
# Caminhos relativos partem da pasta hub-fiscal, onde o serviço systemd "hubfiscal" inicia o hub.
hub:
  # Endereços das calculadoras oficiais da Receita Federal (rodando localmente, só em 127.0.0.1)
  api-regime-geral: http://127.0.0.1:8080/api
  api-simples-nacional: http://127.0.0.1:8082/api
  # Banco oficial gerado pelo Flyway no repositório calculadora-rtc-regime-regular (somente leitura)
  banco-oficial: ../calculadora-rtc-regime-regular/calculadora/db/calculadora-pro.db
  # Quantas chamadas simultâneas às calculadoras durante processamentos em lote
  paralelismo: 8
  # Por quanto tempo (minutos) um resultado de processamento fica disponível para download
  retencao-resultados-minutos: 240
  # Resultados guardados por usuário (na memória do hub): ao passar disso, o mais antigo é descartado
  resultados-por-usuario: 5
  # Processamentos em lote ao mesmo tempo (cada um lê os arquivos inteiros na memória); os demais esperam na fila
  lotes-simultaneos: 2
  # Usuários e senhas do hub (senhas com BCrypt). Faça backup deste arquivo.
  banco-usuarios: ../dados/hub-usuarios.db
  # Empresas atendidas e suas particularidades (regime, município, alíquotas do Simples...). Cadastradas
  # ao importar SPED/XML (o usuário confirma quais) e editadas na tela Cadastros → Empresas. Faça backup deste arquivo.
  banco-empresas: ../dados/hub-empresas.db
  # Consulta pública de CNPJ no cadastro de empresas (botão "Consultar CNPJ"); o servidor precisa de acesso à internet.
  # Só o CNPJ consultado é enviado. Serviços em ordem, separados por vírgula: se um falhar, tenta o seguinte
  # (a BrasilAPI responde 503 para alguns CNPJs que a minhareceita.org, a fonte dela, devolve). Para desligar: desativada
  consulta-cnpj-url: https://brasilapi.com.br/api/cnpj/v1/{cnpj},https://minhareceita.org/{cnpj}
  # Resultado da última verificação de atualização das calculadoras (gravado por scripts/linux/hub.sh verificar)
  arquivo-ultima-atualizacao: ../logs/ultima-atualizacao.json
  # Botão "Atualizar agora" (Sistema > Situação do sistema, só administradores): auto | desativada
  atualizacao-manual: auto
  # Cenário de simulação da CBS (seletor no topo do hub). As simulações de 2026 são calculadas pela calculadora
  # oficial (alíquota de teste) e o hub reescala só a CBS para esta alíquota; a partir de 2027 ela é enviada
  # como alíquota nominal. XML gerado e auditoria de notas usam sempre a alíquota oficial.
  # Para retirar o seletor, apague a linha "aliquota".
  cenario-cbs:
    aliquota: 11.3
    rotulo: Cenário TCU

logging:
  level:
    root: INFO
