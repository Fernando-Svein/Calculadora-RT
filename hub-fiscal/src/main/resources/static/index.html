<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HUB Fiscal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f3a5f'/><text x='16' y='21.5' font-size='14' text-anchor='middle' fill='white' font-family='Segoe UI,Arial' font-weight='700'>HF</text></svg>">
  <script src="js/tema.js?v=20"></script>
  <link rel="stylesheet" href="css/app.css?v=20">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-cab">
      <a class="marca" href="#/">
        <span class="marca-logo" data-logo><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h8l6 6v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 3v6h6"/><path d="m8 15 2.5 2.5L16 12"/></svg></span>
        <span class="marca-texto"><strong>HUB Fiscal</strong></span>
      </a>
      <button class="btn-recolher" id="btnRecolher" type="button" title="Recolher menu" aria-label="Recolher menu"></button>
    </div>
    <label class="menu-busca">
      <span class="menu-busca-ico"></span>
      <input id="menuBusca" type="search" placeholder="Buscar ferramenta" autocomplete="off" aria-label="Buscar ferramenta">
      <kbd>/</kbd>
    </label>
    <nav id="menu" aria-label="Menu principal"></nav>
    <div class="sidebar-rodape">
      <span class="rodape-texto">Calculadoras oficiais Receita Federal/Serpro · LC 214/2025</span>
    </div>
  </aside>

  <div class="area-principal">
    <header class="topo">
      <button class="btn-menu" id="btnMenu" aria-label="Abrir menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="topo-titulo" id="tituloPagina"><strong>Início</strong></div>
      <div class="topo-status" id="statusTopo" title="Situação das calculadoras oficiais">
        <span class="pilula" id="pilRG"><i></i>Regime Geral</span>
        <span class="pilula" id="pilSN"><i></i>Simples Nacional</span>
        <span class="pilula pilula-info" id="pilBase">Base –</span>
      </div>
      <div class="cenario-cbs" id="cenarioCbs" hidden></div>
      <button class="btn-tema" type="button" data-alternar-tema><svg class="tema-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="tema-lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg></button>
      <div class="usuario-menu" id="usuarioMenu"></div>
    </header>
    <main id="conteudo" class="conteudo" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-fundo" data-fechar></div>
    <div class="modal-caixa" role="dialog" aria-modal="true">
      <button class="modal-fechar" data-fechar aria-label="Fechar">×</button>
      <div id="modalConteudo"></div>
    </div>
  </div>

  <script src="js/app.js?v=20"></script>
  <script src="js/icones.js?v=20"></script>
  <script src="js/componentes.js?v=20"></script>
  <script src="js/marca.js?v=20"></script>
  <script src="js/rotulos.js?v=20"></script>
  <script src="js/cenario-cbs.js?v=20"></script>
  <script src="js/modulos/inicio.js?v=20"></script>
  <script src="js/modulos/consulta-nomenclatura.js?v=20"></script>
  <script src="js/modulos/tabelas-classificacao.js?v=20"></script>
  <script src="js/modulos/aliquotas.js?v=20"></script>
  <script src="js/modulos/atividades-simples.js?v=20"></script>
  <script src="js/modulos/nfse.js?v=20"></script>
  <script src="js/modulos/dados-abertos.js?v=20"></script>
  <script src="js/modulos/erros.js?v=20"></script>
  <script src="js/modulos/calc-regime-geral.js?v=20"></script>
  <script src="js/modulos/calc-simples.js?v=20"></script>
  <script src="js/modulos/comparador.js?v=20"></script>
  <script src="js/modulos/bases-calculo.js?v=20"></script>
  <script src="js/modulos/pedagio.js?v=20"></script>
  <script src="js/modulos/lote-classificacao.js?v=20"></script>
  <script src="js/modulos/lote-auditoria.js?v=20"></script>
  <script src="js/modulos/xml.js?v=20"></script>
  <script src="js/modulos/sistema.js?v=20"></script>
  <script src="js/modulos/usuarios.js?v=20"></script>
  <script src="js/modulos/logo.js?v=20"></script>
  <script src="js/iniciar.js?v=20"></script>
</body>
</html>
